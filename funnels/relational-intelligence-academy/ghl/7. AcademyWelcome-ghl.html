:root{
  --bg:#050A14; --bg-2:#08101D; --card:#0C1628; --card-2:#101D33; --edge:rgba(212,175,99,.20); --edge-2:rgba(255,255,255,.08);
  --gold:#D9B46A; --gold-hi:#F2D38F; --gold-lo:#A9864C; --glow:rgba(217,180,106,.55);
  --white:#FFFFFF; --text:#C9D2DF; --muted:#8C99AD; --ink:#0B1424; --paper:#FFFFFF; --field:#F4F5F7; --field-line:#D5DAE1;
  --ph-bg:#FFF1BF; --ph-fg:#6E5200; --ph-line:#D7B13F;
  --sans:"Montserrat","Montserrat FB",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16.5px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
h1,h2,h3{margin:0;color:var(--white);text-wrap:balance}
h2{font:800 clamp(28px,4.4vw,42px)/1.15 var(--sans);text-align:center;letter-spacing:-.005em}
.g{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.col{max-width:860px;margin:0 auto}
.ph{display:inline-block;background:var(--ph-bg);color:var(--ph-fg);border:1px dashed var(--ph-line);border-radius:4px;padding:0 7px;font:700 .8em/1.6 var(--sans);white-space:nowrap}
.svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chk{flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;margin-top:3px}
.chk .svg{width:12px;height:12px;stroke-width:3.2}
.sec{padding-block:80px}

.mock{background:#000;color:var(--muted);font:500 12px/1.4 var(--sans);text-align:center;padding:7px 16px}
.mock b{color:var(--gold-hi)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(90deg,#B8934F,#E2C285 50%,#B8934F);color:var(--ink);text-align:center;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font:800 13px/1.35 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.cd{display:inline-flex;gap:5px;margin-left:10px;font-variant-numeric:tabular-nums;vertical-align:1px}
.cd span{background:var(--ink);color:var(--gold-hi);border-radius:4px;padding:2px 7px;font:800 12.5px/1.3 var(--sans);letter-spacing:.02em}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:560px;margin:0 auto;padding:20px 26px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:var(--ink);font:800 16px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 0 0 1px rgba(255,236,190,.4) inset,0 0 26px var(--glow),0 0 60px rgba(217,180,106,.25),0 12px 24px -10px rgba(0,0,0,.6);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,236,190,.5) inset,0 0 34px var(--glow),0 0 80px rgba(217,180,106,.35),0 14px 28px -10px rgba(0,0,0,.6)}
.btn:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.cta{margin-top:44px;text-align:center}
.cta p{margin:0 0 12px;color:var(--muted);font:600 14px/1.4 var(--sans)}

.hero{position:relative;overflow:hidden;padding-block:56px 40px;background:radial-gradient(900px 520px at 50% 0,rgba(38,72,140,.45),transparent 70%),radial-gradient(700px 600px at 20% 60%,rgba(217,180,106,.08),transparent 70%),var(--bg)}
.hero-bgphoto{position:absolute;right:-60px;top:120px;width:520px;opacity:.28;pointer-events:none;-webkit-mask:linear-gradient(90deg,transparent,#000 45%);mask:linear-gradient(90deg,transparent,#000 45%)}
.hero .wrap{position:relative}
.intro{text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 18px;border-radius:99px;border:1px solid var(--edge);background:rgba(217,180,106,.08);color:var(--gold);font:700 12px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase}
.hero h1{font:900 clamp(36px,6.6vw,74px)/1.02 var(--sans);letter-spacing:-.01em;text-transform:uppercase;margin:20px auto 16px;max-width:1000px}
.tag{font:600 clamp(18px,2.4vw,24px)/1.35 var(--sans);color:var(--white);margin:0 auto 14px;max-width:760px}
.intro .lede{font-size:18px;line-height:1.6;max-width:820px;margin:0 auto}
.intro .lede b{color:var(--white)}
.offer-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start;margin-top:44px}

.bundle{position:relative;width:100%;max-width:520px;aspect-ratio:1/.62;margin:0 auto -60px;z-index:2;container-type:inline-size}
.laptop{position:absolute;left:12%;top:4%;width:62%}
.lap-scr{background:#0A1220;border:2px solid #2A3550;border-radius:8px 8px 0 0;padding:1.6cqw;aspect-ratio:16/10;box-shadow:0 0 40px rgba(217,180,106,.25)}
.lap-ui{height:100%;display:grid;grid-template-columns:30% 1fr;gap:1.2cqw;background:#0F1B2D;border-radius:3px;padding:1.4cqw;overflow:hidden}
.lap-nav{display:grid;gap:.9cqw;align-content:start}
.lap-nav b{font:800 1.5cqw/1.2 var(--sans);color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.6cqw}
.lap-nav i{display:block;font:600 1.25cqw/1.3 var(--sans);font-style:normal;color:var(--text);background:rgba(255,255,255,.05);border-radius:2px;padding:.6cqw .8cqw}
.lap-nav i.on{background:var(--gold);color:var(--ink)}
.lap-main{position:relative;border-radius:3px;overflow:hidden;background:#A98B6C}
.lap-main img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.lap-main::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,20,36,.85),rgba(11,20,36,.2) 60%,transparent)}
.lap-main span{position:absolute;left:1.6cqw;top:1.6cqw;z-index:2;font:800 1.9cqw/1.2 var(--sans);color:#fff;max-width:55%;text-transform:uppercase}
.lap-main em{position:absolute;left:1.6cqw;bottom:1.6cqw;z-index:2;width:4cqw;height:4cqw;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.lap-main em::after{content:"";margin-left:.4cqw;border-style:solid;border-width:.9cqw 0 .9cqw 1.4cqw;border-color:transparent transparent transparent var(--ink)}
.lap-base{height:2.2cqw;background:linear-gradient(180deg,#3A465E,#1C2436);border-radius:0 0 1.4cqw 1.4cqw;margin:0 -6%}
.book{position:absolute;width:21%;aspect-ratio:3/4.2;border-radius:2px 5px 5px 2px;background:radial-gradient(120% 80% at 75% 8%,#1F375F,#0F1B2D 60%,#0B1424);box-shadow:3px 3px 0 -1px #E9E0CD,0 20px 30px -12px rgba(0,0,0,.8);
  display:flex;flex-direction:column;justify-content:space-between;padding:1.8cqw 1.4cqw;text-align:center;border:1px solid rgba(217,180,106,.35)}
.book small{font:700 1.15cqw/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.book b{font:900 1.9cqw/1.1 var(--sans);color:#fff;text-transform:uppercase}
.book i{font:600 1.05cqw/1.2 var(--sans);font-style:normal;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.b1{right:9%;top:0;transform:rotate(4deg);z-index:1}
.b2{right:2%;top:16%;transform:rotate(7deg);z-index:0}
.b3{left:0;top:22%;transform:rotate(-6deg);z-index:0}
.phone{position:absolute;right:20%;bottom:6%;width:14%;aspect-ratio:9/18.5;border-radius:2.4cqw;background:#050A14;border:2px solid #2A3550;padding:.9cqw;z-index:3;box-shadow:0 20px 30px -10px rgba(0,0,0,.8)}
.ph-scr{height:100%;border-radius:1.6cqw;background:#0F1B2D;padding:1.2cqw .9cqw;display:grid;gap:.9cqw;align-content:start}
.ph-scr b{font:800 1cqw/1.2 var(--sans);color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.ph-scr i{display:block;height:2.6cqw;border-radius:1cqw;background:#1B2D4F}
.ph-scr i.me{background:var(--gold);width:80%;justify-self:end}

.offer-box{position:relative;background:linear-gradient(180deg,#0A1324,#070E1B);border:1px solid var(--edge);border-radius:14px;padding:84px 34px 34px;text-align:center;box-shadow:0 0 60px rgba(38,72,140,.25)}
.offer-box h3{font:900 clamp(26px,3vw,34px)/1.1 var(--sans);text-transform:uppercase}
.offer-box .inc{display:inline-flex;gap:10px;align-items:center;margin:16px 0 26px;color:var(--white);font:700 16px/1.3 var(--sans)}
.offer-box h4{margin:0 0 14px;font:800 clamp(22px,2.6vw,28px)/1.1 var(--sans);color:var(--gold)}
.bl{list-style:none;margin:0 auto;padding:0;text-align:left;display:grid;gap:7px;max-width:420px}
.bl li{font:600 14.5px/1.35 var(--sans);color:var(--white)}
.bl li span{color:var(--gold);font-weight:800}
.today{margin:28px 0 4px;font:900 clamp(32px,4vw,44px)/1 var(--sans);color:var(--white)}
.today span{color:var(--gold)}
.offer-box .sm{font:600 14px/1.4 var(--sans);color:var(--muted)}

.right-intro{font-size:18px;line-height:1.65;color:var(--white);margin:0 0 26px}
.right-intro b{color:var(--gold-hi)}
.order{position:relative;border-radius:12px;overflow:visible;background:var(--paper);box-shadow:0 0 0 1px rgba(217,180,106,.5),0 0 50px rgba(217,180,106,.18),0 40px 70px -30px rgba(0,0,0,.9)}
.save{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:linear-gradient(90deg,#B8934F,#E2C285,#B8934F);color:var(--ink);font:800 11px/1 var(--sans);letter-spacing:.14em;padding:8px 22px;border-radius:99px;white-space:nowrap;text-transform:uppercase}
.o-head{background:var(--card);color:#fff;text-align:center;padding:26px 20px 18px;border-radius:12px 12px 0 0}
.o-head b{display:block;font:900 20px/1.2 var(--sans);text-transform:uppercase}
.o-head span{font:500 14.5px/1.4 var(--sans);color:var(--text)}
.o-body{padding:24px 24px 22px;color:var(--ink)}
.field{display:block;width:100%;margin-bottom:12px;padding:14px 14px;border:1px solid var(--field-line);border-radius:6px;background:var(--field);font:500 15px var(--sans);color:var(--ink)}
.field::placeholder{color:#6B7484}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px;border:0;padding:0}
.plan{display:block;padding:12px;border:1.5px solid var(--field-line);border-radius:8px;cursor:pointer;text-align:center;position:relative}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan b{display:block;font:900 22px/1.1 var(--sans);color:var(--ink)}
.plan span{font:600 12.5px/1.3 var(--sans);color:#5B6574}
.plan:has(input:checked){border-color:var(--gold-lo);background:#FBF4E4;box-shadow:0 0 0 1px var(--gold-lo) inset}
.plan:has(input:focus-visible){outline:2px solid var(--gold-lo);outline-offset:2px}
.order .btn{max-width:none;box-shadow:0 0 18px rgba(217,180,106,.45),0 8px 16px -8px rgba(0,0,0,.4);font-size:15px}
.inv{text-align:center;margin-top:20px}
.inv h5{margin:0;font:800 21px/1.2 var(--sans);color:var(--ink)}
.inv .big{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 4px}
.inv .big b{font:900 52px/1 var(--sans);color:var(--ink)}
.inv .big span{text-align:left;font:800 13px/1.3 var(--sans);color:var(--gold-lo);text-transform:uppercase;letter-spacing:.06em}
.inv small{display:block;font:500 13px/1.5 var(--sans);color:#5B6574}
.note-bar{margin:14px 0 0;padding:9px 12px;border-radius:99px;background:#F7F0E0;border:1px solid #E7D7B2;color:#6E5520;font:700 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.secure{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:12px;font:700 13.5px/1.3 var(--sans);color:var(--ink)}
.embed{margin-top:10px;text-align:center;font:500 12px/1.4 var(--sans);color:#6B7484}

.trust{margin-top:56px;border-top:1px solid var(--edge-2);padding-top:26px}
.trust-row{display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap;margin-bottom:22px}
.trust-row div{display:flex;align-items:center;gap:12px;font:700 14.5px/1.35 var(--sans);color:var(--white)}
.trust-row div small{display:block;font:500 13px/1.3 var(--sans);color:var(--muted)}
.trust-row .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge);color:var(--gold)}
.trust-row .ico .svg{width:20px;height:20px}
.trust-row .div{width:1px;height:40px;background:var(--edge-2)}
.ticks{list-style:none;margin:0;padding:18px 0 0;border-top:1px solid var(--edge-2);display:flex;justify-content:center;flex-wrap:wrap;gap:10px 34px}
.ticks li{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ticks .svg{color:var(--gold);width:15px;height:15px;stroke-width:3}

.sec-intro{max-width:820px;margin:14px auto 0;text-align:center;font-size:17px}
.weeks{display:grid;gap:26px;margin-top:44px}
.week{background:linear-gradient(180deg,var(--card),#0A1222);border:1px solid var(--edge-2);border-radius:12px;padding:30px 30px 26px}
.week-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.week-h small{font:800 14px/1 var(--sans);letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.week-h h3{font:800 clamp(21px,2.4vw,26px)/1.2 var(--sans)}
.week-h .phase{margin-left:auto;font:700 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border:1px solid var(--edge);border-radius:99px;padding:7px 12px}
.week .lead-in{margin:0 0 10px;color:var(--text)}
.week ul{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:9px}
.week li{display:flex;gap:12px;color:var(--white);font-size:16px;line-height:1.5}
.walk{background:#070E1B;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:16px 20px}
.walk b{display:block;font:800 13px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.walk p{margin:0;color:var(--text);font-size:16px}

.founder{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:center;background:linear-gradient(135deg,#0C1628,#08101D);border:1px solid var(--edge);border-radius:16px;padding:28px;margin-top:80px}
.founder figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:#A98B6C}
.founder figure img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 8%}
.founder figure figcaption{position:absolute;left:12px;top:12px;background:rgba(5,10,20,.8);border:1px solid var(--edge);border-radius:6px;padding:6px 10px;font:700 10.5px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.founder .pill{margin-bottom:14px}
.founder h3{font:900 clamp(28px,3.6vw,42px)/1.1 var(--sans)}
.founder h3 span{display:block;color:var(--gold)}
.founder p{margin:16px 0 0;font-size:17px}
.dates{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.dates span{font:700 13px/1 var(--sans);padding:10px 12px;border-radius:6px;background:var(--card-2);border:1px solid var(--edge-2);color:var(--white);white-space:nowrap}
.dates span.gst{border-color:var(--gold);color:var(--gold-hi)}

.agents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:40px}
.agent{background:linear-gradient(180deg,var(--card),#0A1222);border:1px solid var(--edge-2);border-radius:12px;padding:24px}
.agent .ai{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:rgba(217,180,106,.12);border:1px solid var(--edge);color:var(--gold);margin-bottom:14px}
.agent .ai .svg{width:21px;height:21px}
.agent small{display:block;font:800 11px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.agent h3{font:800 19px/1.3 var(--sans)}
.agent-shot{margin:22px auto 0;max-width:860px;border:1.5px dashed var(--edge);border-radius:12px;padding:30px;text-align:center;color:var(--muted);font-size:15px}

.bonus-head{text-align:center;margin-top:30px}
.bonus-head p{margin:0 0 6px;font:700 18px/1.3 var(--sans);color:var(--white)}
.bonus-head h3{font:900 clamp(30px,4.4vw,46px)/1.1 var(--sans);color:var(--gold)}
.bonuses{display:grid;gap:14px;margin-top:30px}
.bn{position:relative;background:linear-gradient(180deg,var(--card),#0A1222);border:1px solid var(--edge-2);border-radius:12px;padding:22px 24px}
.bn .tagb{position:absolute;right:16px;top:-11px;background:linear-gradient(90deg,#B8934F,#E2C285);color:var(--ink);font:800 10.5px/1 var(--sans);letter-spacing:.14em;padding:7px 12px;border-radius:99px;text-transform:uppercase}
.bn h3{font:800 18px/1.3 var(--sans);color:var(--gold-hi);margin-bottom:6px}
.bn h3 span{color:var(--gold)}

.stack{margin-top:22px;background:#070E1B;border:1px solid var(--edge);border-radius:12px;padding:8px 24px 22px}

.stack .row{display:flex;justify-content:space-between;align-items:center;padding-top:18px}
.stack .row span{font:800 14px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.stack .row b{font:900 40px/1 var(--sans);color:var(--gold-hi)}
.stack .row small{display:block;text-align:right;font:600 13px/1.4 var(--sans);color:var(--muted)}
